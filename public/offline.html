<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · Todoish</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fcfaf8; color: #202020; text-align: center; padding: 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #1f1f1f; color: #e8e8e8; } }
  img { width: 72px; height: 72px; }
  h1 { font-size: 20px; margin: 20px 0 6px; }
  p { margin: 0 0 20px; opacity: .7; }
  button { font: inherit; border: 0; border-radius: 8px; background: #dc4c3e; color: #fff; padding: 10px 18px; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="">
    <h1>You're offline, ish</h1>
    <p>Todoish keeps your tasks on the server, so it needs a connection.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
